<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>404 — Page not found | Dali GHarsellaoui</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      color: #f8fafc;
      font-family: 'DM Sans', system-ui, sans-serif;
      padding: 24px;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: -20%;
      background:
        radial-gradient(ellipse 40% 35% at 75% 20%, rgba(161, 205, 244, 0.08), transparent 70%),
        radial-gradient(ellipse 35% 30% at 15% 85%, rgba(59, 130, 246, 0.07), transparent 70%);
      pointer-events: none;
    }
    .wrap {
      position: relative;
      text-align: center;
      max-width: 480px;
    }
    .mark {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      margin: 0 auto 28px;
      background: linear-gradient(135deg, #a1cdf4 0%, #3b82f6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Sora', sans-serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #0a1420;
    }
    .code {
      font-family: 'Sora', sans-serif;
      font-size: clamp(72px, 18vw, 128px);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      background: linear-gradient(135deg, #a1cdf4 0%, #3b82f6 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    h1 {
      font-family: 'Sora', sans-serif;
      font-size: 22px;
      font-weight: 600;
      margin: 16px 0 10px;
    }
    p {
      color: #94a3b8;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      border-radius: 12px;
      background: linear-gradient(135deg, #a1cdf4 0%, #3b82f6 100%);
      color: #0a1420;
      font-weight: 600;
      font-size: 16px;
      text-decoration: none;
      transition: transform 0.2s ease;
    }
    a:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mark">DG</div>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist — but the work does.</p>
    <a href="/">← Back to the portfolio</a>
  </div>
</body>
</html>
